    required this.onChange,
  });

  @override
  State<AccountsPage> createState() => _AccountsPageState();
}

class _AccountsPageState extends State<AccountsPage> {
  Future<void> openAccountForm({Account? existing}) async {
    final nameController = TextEditingController(
      text: existing?.name ?? '',
    );

    final balanceController = TextEditingController(
      text: existing?.balance.toString() ?? '0',
    );

    await showDialog(
      context: context,
      builder: (dialogContext) {
        return AlertDialog(
          title: Text(
            existing == null
                ? 'নতুন অ্যাকাউন্ট'
                : 'অ্যাকাউন্ট এডিট',
          ),
          content: Column(
            mainAxisSize: MainAxisSize.min,
            children: [
              TextField(
                controller: nameController,
                decoration: const InputDecoration(
                  labelText: 'অ্যাকাউন্ট নাম',
                ),
              ),
              const SizedBox(height: 12),
              TextField(
                controller: balanceController,
                keyboardType: TextInputType.number,
                decoration: const InputDecoration(
                  labelText: 'ব্যালেন্স',
                ),
              ),
            ],
          ),
          actions: [
            TextButton(
              onPressed: () => Navigator.pop(dialogContext),
              child: const Text('বাতিল'),
            ),
            FilledButton(
              onPressed: () async {
                final name = nameController.text.trim();

                if (name.isEmpty) {
                  return;
                }

                final balance =
                    double.tryParse(balanceController.text) ?? 0;

                final account =
                    existing ?? Account(name, balance);

                account.name = name;
                account.balance = balance;

                if (existing == null) {
                  widget.store.accounts.add(account);
                }

                await widget.store.save();
                widget.onChange();

                if (mounted) {
                  setState(() {});
                }

                if (dialogContext.mounted) {
                  Navigator.pop(dialogContext);
                }
              },
              child: const Text('সংরক্ষণ'),
            ),
          ],
        );
      },
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('অ্যাকাউন্ট ম্যানেজ করুন'),
        actions: [
          IconButton(
            onPressed: () => openAccountForm(),
            icon: const Icon(Icons.add),
          ),
        ],
      ),
      body: ListView(
        padding: const EdgeInsets.all(14),
        children: [
          Card(
            color: primary,
            child: Padding(
              padding: const EdgeInsets.all(22),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text(
