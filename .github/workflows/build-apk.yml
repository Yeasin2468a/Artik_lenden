name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          rm -rf project
          mkdir project
          unzip -q arthik_lenden_apk_ready.zip -d project

          echo "===== PROJECT STRUCTURE ====="
          find project -maxdepth 5 -type f | sort | head -300

          echo "===== PUBSPEC ====="
          find project -name pubspec.yaml -print

          echo "===== GRADLE FILES ====="
          find project -path "*/android/*" \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name pubspec.yaml -print -quit)")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "Flutter project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arthik-lenden-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
