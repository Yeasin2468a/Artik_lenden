class TransactionTile extends StatelessWidget {
  final Tx tx;

  const TransactionTile({
    super.key,
    required this.tx,
  });

  @override
  Widget build(BuildContext context) {
    final isIn =
        tx.type == 'পেমেন্ট ইন' || tx.type == 'বিক্রয়';

    return Card(
      child: ListTile(
        leading: CircleAvatar(
          backgroundColor:
              (isIn ? primary : pink).withOpacity(.12),
          child: Icon(
            isIn
                ? Icons.arrow_downward
                : Icons.arrow_upward,
            color: isIn ? primary : pink,
          ),
        ),
        title: Text(tx.type),
        subtitle: Text(
          '${tx.description.isEmpty ? 'বিবরণ নেই' : tx.description}'
          '\n${dateText(tx.date)}',
        ),
        isThreeLine: true,
        trailing: Text(
          '${isIn ? '+' : '-'}${money(tx.amount)}',
          style: TextStyle(
            color: isIn ? primary : pink,
            fontWeight: FontWeight.bold,
          ),
        ),
      ),
    );
  }
}

