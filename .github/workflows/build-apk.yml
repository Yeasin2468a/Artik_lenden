name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q arthik_lenden_apk_ready.zip -d project

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name pubspec.yaml -print -quit)")
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Generate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          echo "===== CHECK ANDROID ====="
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          find android/app -maxdepth 2 -type f | sort

      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arthik-lenden-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
