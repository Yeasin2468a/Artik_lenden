Future<void> showTxForm(
  BuildContext context,
  Store store,
  VoidCallback refresh, {
  String? type,
}) async {
  final amountController = TextEditingController();
  final descriptionController = TextEditingController();

  String selected = type ?? 'পেমেন্ট ইন';

  await showDialog(
    context: context,
    builder: (dialogContext) {
      return StatefulBuilder(
        builder: (context, setDialogState) {
          return AlertDialog(
            title: const Text('নতুন লেনদেন'),
            content: SingleChildScrollView(
              child: Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  DropdownButtonFormField<String>(
                    value: selected,
                    decoration: const InputDecoration(
                      labelText: 'ধরণ',
                    ),
                    items: const [
                      'পেমেন্ট ইন',
                      'পেমেন্ট আউট',
                      'বিক্রয়',
                      'ক্রয়',
                      'খরচ',
                      'নোট',
                    ]
                        .map(
                          (value) => DropdownMenuItem(
                            value: value,
                            child: Text(value),
                          ),
                        )
                        .toList(),
                    onChanged: (value) {
                      if (value == null) return;

                      setDialogState(() {
                        selected = value;
                      });
                    },
                  ),
                  const SizedBox(height: 12),
                  TextField(
                    controller: descriptionController,
                    decoration: const InputDecoration(
                      labelText: 'পার্টি/বিবরণ',
                    ),
                  ),
                  const SizedBox(height: 12),
                  TextField(
                    controller: amountController,
                    keyboardType: TextInputType.number,
                    decoration: const InputDecoration(
                      labelText: 'টাকার পরিমাণ',
                    ),
                  ),
                ],
              ),
            ),
            actions: [
              TextButton(
                onPressed: () => Navigator.pop(dialogContext),
                child: const Text('বাতিল'),
              ),
              FilledButton(
                onPressed: () async {
                  final amount =
                      double.tryParse(amountController.text) ?? 0;

                  if (amount <= 0) {
                    return;
                  }

                  store.txs.add(
                    Tx(
                      selected,
                      descriptionController.text.trim(),
                      amount,
                      DateTime.now(),
                    ),
                  );

                  if (store.accounts.isNotEmpty) {
                    final isIn = selected == 'পেমেন্ট ইন' ||
                        selected == 'বিক্রয়';

                    if (isIn) {
                      store.accounts.first.balance += amount;
                    } else if (selected != 'নোট') {
                      store.accounts.first.balance -= amount;
                    }
                  }

                  await store.save();
                  refresh();

                  if (dialogContext.mounted) {
                    Navigator.pop(dialogContext);
                  }
                },
                child: const Text('সংরক্ষণ'),
              ),
            ],
          );
        },
      );
    },
  );
}

Future<void> showPartyForm(
  BuildContext context,
  Store store,
  VoidCallback refresh, {
  Party? existing,
}) async {
  final nameController = TextEditingController(
    text: existing?.name ?? '',
  );

  final balanceController = TextEditingController(
    text: existing?.balance.toString() ?? '0',
  );

  await showDialog(
    context: context,
    builder: (dialogContext) {
      return AlertDialog(
        title: Text(
          existing == null ? 'নতুন পার্টি' : 'পার্টি এডিট',
        ),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            TextField(
              controller: nameController,
              decoration: const InputDecoration(
                labelText: 'নাম',
              ),
            ),
            const SizedBox(height: 12),
            TextField(
              controller: balanceController,
              keyboardType: TextInputType.number,
              decoration: const InputDecoration(
                labelText: 'ব্যালেন্স',
              ),
            ),
          ],
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(dialogContext),
            child: const Text('বাতিল'),
          ),
          FilledButton(
            onPressed: () async {
              final name = nameController.text.trim();

              if (name.isEmpty) {
                return;
              }

              final balance =
                  double.tryParse(balanceController.text) ?? 0;

              final party = existing ?? Party(name, balance);

              party.name = name;
              party.balance = balance;

              if (existing == null) {
                store.parties.add(party);
              }

              await store.save();
              refresh();

              if (dialogContext.mounted) {
                Navigator.pop(dialogContext);
              }
            },
            child: const Text('সংরক্ষণ'),
          ),
        ],
      );
    },
  );
}

Future<void> showItemForm(
  BuildContext context,
  Store store,
  VoidCallback refresh, {
  Item? existing,
}) async {
  final nameController = TextEditingController(
    text: existing?.name ?? '',
  );

  final priceController = TextEditingController(
    text: existing?.price.toString() ?? '0',
  );

  final stockController = TextEditingController(
    text: existing?.stock.toString() ?? '0',
  );

  await showDialog(
    context: context,
    builder: (dialogContext) {
      return AlertDialog(
        title: Text(
          existing == null ? 'নতুন আইটেম' : 'আইটেম এডিট',
        ),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            TextField(
              controller: nameController,
              decoration: const InputDecoration(
                labelText: 'আইটেম নাম',
              ),
            ),
            const SizedBox(height: 12),
            TextField(
              controller: priceController,
              keyboardType: TextInputType.number,
              decoration: const InputDecoration(
                labelText: 'দাম',
              ),
            ),
            const SizedBox(height: 12),
            TextField(
              controller: stockController,
              keyboardType: TextInputType.number,
              decoration: const InputDecoration(
                labelText: 'স্টক',
              ),
            ),
          ],
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(dialogContext),
            child: const Text('বাতিল'),
          ),
          FilledButton(
            onPressed: () async {
              final name = nameController.text.trim();

              if (name.isEmpty) {
                return;
              }

              final price =
                  double.tryParse(priceController.text) ?? 0;

              final stock =
                  int.tryParse(stockController.text) ?? 0;

              final item = existing ?? Item(name, price, stock);

              item.name = name;
              item.price = price;
              item.stock = stock;

              if (existing == null) {
                store.items.add(item);
              }

              await store.save();
              refresh();

              if (dialogContext.mounted) {
                Navigator.pop(dialogContext);
              }
            },
            child: const Text('সংরক্ষণ'),
          ),
        ],
      );
    },
  );
}
