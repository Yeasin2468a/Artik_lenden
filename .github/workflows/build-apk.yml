class Store {
  List<Account> accounts = [
    Account('Cash', 0),
    Account('Bkash', 0),
  ];

  List<Tx> txs = [];
  List<Party> parties = [];
  List<Item> items = [];

  double get balance {
    return accounts.fold(
      0,
      (sum, account) => sum + account.balance,
    );
  }

  double get totalIn {
    return txs
        .where((tx) =>
            tx.type == 'পেমেন্ট ইন' || tx.type == 'বিক্রয়')
        .fold(0, (sum, tx) => sum + tx.amount);
  }

  double get totalOut {
    return txs
        .where((tx) =>
            tx.type == 'পেমেন্ট আউট' ||
            tx.type == 'ক্রয়' ||
            tx.type == 'খরচ')
        .fold(0, (sum, tx) => sum + tx.amount);
  }

  Future<void> load() async {
    final prefs = await SharedPreferences.getInstance();

    final raw = prefs.getString('arthik_store');

    if (raw == null || raw.isEmpty) {
      return;
    }

    try {
      final data = jsonDecode(raw);

      accounts = (data['accounts'] as List? ?? [])
          .map((x) => Account.fromJson(x))
          .toList();

      txs = (data['txs'] as List? ?? [])
          .map((x) => Tx.fromJson(x))
          .toList();

      parties = (data['parties'] as List? ?? [])
          .map((x) => Party.fromJson(x))
          .toList();

      items = (data['items'] as List? ?? [])
          .map((x) => Item.fromJson(x))
          .toList();
    } catch (_) {
      accounts = [
        Account('Cash', 0),
        Account('Bkash', 0),
      ];
      txs = [];
      parties = [];
      items = [];
    }
  }

  Future<void> save() async {
    final prefs = await SharedPreferences.getInstance();

    await prefs.setString(
      'arthik_store',
      jsonEncode({
        'accounts': accounts.map((x) => x.toJson()).toList(),
        'txs': txs.map((x) => x.toJson()).toList(),
        'parties': parties.map((x) => x.toJson()).toList(),
        'items': items.map((x) => x.toJson()).toList(),
      }),
    );
  }
}

class Account {
  String name;
  double balance;

  Account(this.name, this.balance);

  Map<String, dynamic> toJson() {
    return {
      'name': name,
      'balance': balance,
    };
  }

  factory Account.fromJson(Map<String, dynamic> json) {
    return Account(
      json['name']?.toString() ?? '',
      (json['balance'] as num?)?.toDouble() ?? 0,
    );
  }
}

class Tx {
  String type;
  String description;
  double amount;
  DateTime date;

  Tx(
    this.type,
    this.description,
    this.amount,
    this.date,
  );

  Map<String, dynamic> toJson() {
    return {
      'type': type,
      'description': description,
      'amount': amount,
      'date': date.toIso8601String(),
    };
  }

  factory Tx.fromJson(Map<String, dynamic> json) {
    return Tx(
      json['type']?.toString() ?? '',
      json['description']?.toString() ?? '',
      (json['amount'] as num?)?.toDouble() ?? 0,
      DateTime.tryParse(json['date']?.toString() ?? '') ??
          DateTime.now(),
    );
  }
}

class Party {
  String name;
  double balance;

  Party(this.name, this.balance);

  Map<String, dynamic> toJson() {
    return {
      'name': name,
      'balance': balance,
    };
  }

  factory Party.fromJson(Map<String, dynamic> json) {
    return Party(
      json['name']?.toString() ?? '',
      (json['balance'] as num?)?.toDouble() ?? 0,
    );
  }
}

class Item {
  String name;
  double price;
  int stock;

  Item(this.name, this.price, this.stock);

  Map<String, dynamic> toJson() {
    return {
      'name': name,
      'price': price,
      'stock': stock,
    };
  }

  factory Item.fromJson(Map<String, dynamic> json) {
    return Item(
      json['name']?.toString() ?? '',
      (json['price'] as num?)?.toDouble() ?? 0,
      (json['stock'] as num?)?.toInt() ?? 0,
    );
  }
}

String money(num value) {
  return '৳ ${value.toStringAsFixed(0)}';
}

String dateText(DateTime date) {
  return '${date.day.toString().padLeft(2, '0')}/'
      '${date.month.toString().padLeft(2, '0')}/'
      '${date.year}';
}

